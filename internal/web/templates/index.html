<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/fa.min.css">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="application-name" content="ExpenseOwl">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ExpenseOwl">
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
    <link rel="icon" href="/pwa/icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="/pwa/icon-192.png">
    <link rel="stylesheet" href="/style.css">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'system';
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <script src="/pwa.js"></script>
    <title>ExpenseOwl Dashboard</title>
    <script src="/chart.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="nav-bar">
                <a href="/">
                    <img src="/pwa/icon-192.png" alt="ExpenseOwl Logo" height="85" style="vertical-align: middle; margin-right: 20px;">
                </a>
                <a href="/" class="view-button active" data-tooltip="Dashboard">
                    <i class="fa-solid fa-chart-pie"></i>
                </a>
                <a href="/table" class="view-button" data-tooltip="Table View">
                    <i class="fa-solid fa-table"></i>
                </a>
                <a href="/settings" class="view-button" data-tooltip="Settings">
                    <i class="fa-solid fa-gear"></i>
                </a>
            </div>
        </header>

        <div class="month-navigation">
            <button id="prevMonth" class="nav-button"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="current-month" id="currentMonth"></div>
            <button id="nextMonth" class="nav-button"><i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <div class="owner-toggle" id="ownerToggle">
            <button class="owner-button" data-owner="joao">João</button>
            <button class="owner-button" data-owner="maria">Maria</button>
            <button class="owner-button" data-owner="common">Common</button>
        </div>

        <div class="table-controls">
            <button id="toggleExpenseFormBtn" class="nav-button"><i class="fa-solid fa-plus"></i> Add Expense</button>
        </div>

        <div id="addExpenseContainer" style="display: none;">
            <div class="form-container">
                <form id="expenseForm" class="expense-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" value="-" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">categories</option>
                        </select>
                    </div>
    
                    <div class="form-group">
                        <label for="tags-input">Tags</label>
                        <div id="tags-input-container" class="tags-input-container">
                            <div id="selected-tags" class="selected-tags"></div>
                            <input type="text" id="tags-input" placeholder="(optional)">
                        </div>
                        <div id="tags-dropdown" class="tags-dropdown"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" step="0.01" min="0.01" max="9000000000000000" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                        <script>
                            const today = new Date();
                            const year = today.getFullYear();
                            const month = String(today.getMonth() + 1).padStart(2, '0');
                            const day = String(today.getDate()).padStart(2, '0');
                            const formattedDate = `${year}-${month}-${day}`;
                            document.getElementById('date').value = formattedDate;
                        </script>
                    </div>
                    
                    <div class="form-group form-group-checkbox">
                        <label for="reportGain">Report Gain</label>
                        <input type="checkbox" id="reportGain" class="styled-checkbox">
                    </div>

					<div class="form-group form-group-wide">
						<label for="notes">Notes</label>
						<textarea id="notes" maxlength="2000" rows="2" placeholder="Optional context"></textarea>
					</div>

					<div class="form-group">
						<label for="receipt">Receipt</label>
						<input type="file" id="receipt" accept="image/jpeg,image/png,image/webp,application/pdf">
						<small>JPG, PNG, WebP, or PDF · 5 MB max</small>
					</div>
    
                    <button type="submit" class="nav-button">Add Expense</button>
                </form>
                <div id="formMessage" class="form-message"></div>
            </div>
        </div>

        <div class="chart-container">
            <div id="noDataMessage" class="no-data" style="display: none; width: 100%;">No expenses recorded this month.</div>
            <div class="chart-box">
                <canvas id="categoryPieChart"></canvas>
            </div>
            <div class="legend-box" id="customLegend">
            </div>
        </div>

        <div id="cashflow-section" class="cashflow-container">
            <div class="cashflow-item income">
                <div class="cashflow-label">Income</div>
                <div class="cashflow-value" id="cashflow-income"></div>
            </div>
            <div class="cashflow-item expenses">
                <div class="cashflow-label">Expenses</div>
                <div class="cashflow-value" id="cashflow-expenses"></div>
            </div>
            <div class="cashflow-item balance">
                <div class="cashflow-label">Balance</div>
                <div class="cashflow-value" id="cashflow-balance"></div>
            </div>
        </div>

		<section class="dashboard-section" aria-labelledby="insights-heading">
			<div class="section-heading">
				<div>
					<span class="section-kicker">Monthly signals</span>
					<h2 id="insights-heading">What changed</h2>
				</div>
			</div>
			<div id="insightsGrid" class="insights-grid"></div>
		</section>

		<section id="targetsSection" class="dashboard-section" aria-labelledby="targets-heading">
			<div class="section-heading">
				<div>
					<span class="section-kicker">Soft limits</span>
					<h2 id="targets-heading">Category targets</h2>
				</div>
				<a href="/settings#category-targets" class="section-link">Adjust targets</a>
			</div>
			<div id="targetsGrid" class="targets-grid"></div>
		</section>

		<section class="dashboard-section trend-section" aria-labelledby="trend-heading">
			<div class="section-heading">
				<div>
					<span class="section-kicker">12-month flight path</span>
					<h2 id="trend-heading">Income and spending trend</h2>
				</div>
			</div>
			<div class="trend-chart-box">
				<canvas id="monthlyTrendChart"></canvas>
			</div>
		</section>
    </div>

    <script src="/functions.js"></script>
    <script>
        let currentCurrency = 'usd';
        let startDate = 1;
        let pieChart = null;
		let trendChart = null;
        let currentDate = new Date();
        let allExpenses = [];
		let categoryTargets = {};
        let disabledCategories = new Set();
        let categoryColors = {};
        let allTags = new Set();
        let selectedTags = new Set();
        let currentOwner = 'joao'; // Default to João

        function assignCategoryColors(categories) {
            categories.forEach((category, index) => {
                if (!categoryColors[category]) {
                    categoryColors[category] = colorPalette[index % colorPalette.length];
                }
            });
        }

        function filterByOwner(expenses) {
            if (currentOwner === 'common') return expenses;
            return expenses.filter(exp => {
                const owner = exp.owner || 'common';
                return owner === currentOwner;
            });
        }

        function calculateCategoryBreakdown(expenses) {
            const ownerExpenses = filterByOwner(expenses);
            const categoryTotals = {};
            let totalAmount = 0;
            ownerExpenses.forEach(exp => {
                if (exp.amount < 0 && !disabledCategories.has(exp.category)) {
                    const amount = Math.abs(exp.amount);
                    categoryTotals[exp.category] = (categoryTotals[exp.category] || 0) + amount;
                    totalAmount += amount;
                }
            });
            return Object.entries(categoryTotals)
                .map(([category, total]) => ({
                    category,
                    total,
                    percentage: totalAmount > 0 ? (total / totalAmount) * 100 : 0
                }))
                .sort((a, b) => b.total - a.total);
        }

        function calculateIncome(expenses) {
            const ownerExpenses = filterByOwner(expenses);
            return ownerExpenses
                .filter(exp => exp.amount > 0)
                .reduce((sum, exp) => sum + exp.amount, 0);
        }

        function calculateExpenses(expenses) {
            const ownerExpenses = filterByOwner(expenses);
            return ownerExpenses
                .filter(exp => exp.amount < 0)
                .reduce((sum, exp) => sum + Math.abs(exp.amount), 0);
        }

        function updateChartAndLegend() {
            const ownerExpenses = filterByOwner(allExpenses);
            const monthExpenses = getMonthExpenses(ownerExpenses);
            const chartBox = document.querySelector('.chart-box');
            const legendBox = document.getElementById('customLegend');
            const cashflowSection = document.getElementById('cashflow-section');
            const noDataMessage = document.getElementById('noDataMessage');
            const hasExpenses = monthExpenses.some(e => e.amount < 0);
            if (!hasExpenses) {
                if (pieChart) {
                    pieChart.destroy();
                    pieChart = null;
                }
                chartBox.style.display = 'none';
                legendBox.style.display = 'none';
                cashflowSection.style.display = 'none';
                noDataMessage.style.display = 'block';
            } else {
                chartBox.style.display = 'flex';
                legendBox.style.display = 'flex';
                cashflowSection.style.display = 'flex';
                noDataMessage.style.display = 'none';
                
                const categoryData = calculateCategoryBreakdown(monthExpenses);
                updateCashflow(monthExpenses);
                createPieChart(categoryData);
                updateLegend(categoryData);
            }
			updateAnalytics();
        }

		function expensesForPeriod(expenses, date) {
			const { start, end } = getMonthBounds(date);
			return expenses.filter(expense => {
				const expenseDate = new Date(expense.date);
				return expenseDate >= start && expenseDate <= end;
			});
		}

		function updateAnalytics() {
			const ownerExpenses = filterByOwner(allExpenses);
			const monthExpenses = expensesForPeriod(ownerExpenses, currentDate);
			updateTargets(monthExpenses);
			updateInsights(ownerExpenses, monthExpenses);
			updateTrend(ownerExpenses);
		}

		function updateTargets(monthExpenses) {
			const section = document.getElementById('targetsSection');
			const grid = document.getElementById('targetsGrid');
			const entries = Object.entries(categoryTargets).filter(([, target]) => target > 0);
			section.style.display = entries.length ? 'block' : 'none';
			grid.innerHTML = '';
			entries.forEach(([category, target]) => {
				const spent = monthExpenses
					.filter(expense => expense.amount < 0 && expense.category === category)
					.reduce((sum, expense) => sum + Math.abs(expense.amount), 0);
				const percent = Math.round((spent / target) * 100);
				const card = document.createElement('article');
				card.className = `target-card${percent > 100 ? ' over-target' : ''}`;
				card.innerHTML = `
					<div class="target-line"><strong>${escapeHTML(category)}</strong><span>${percent}%</span></div>
					<div class="target-track" role="progressbar" aria-label="${escapeHTML(category)} target" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(percent, 100)}">
						<span style="width: ${Math.min(percent, 100)}%"></span>
					</div>
					<div class="target-values"><span>${formatCurrency(spent)} spent</span><span>${formatCurrency(target)} target</span></div>`;
				grid.appendChild(card);
			});
		}

		function updateInsights(ownerExpenses, monthExpenses) {
			const grid = document.getElementById('insightsGrid');
			const currentSpend = calculateExpenses(monthExpenses);
			const previousDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 15);
			const previousSpend = calculateExpenses(expensesForPeriod(ownerExpenses, previousDate));
			const categoryTotals = {};
			monthExpenses.filter(expense => expense.amount < 0).forEach(expense => {
				categoryTotals[expense.category] = (categoryTotals[expense.category] || 0) + Math.abs(expense.amount);
			});
			const largest = Object.entries(categoryTotals).sort((a, b) => b[1] - a[1])[0];
			const sixMonthTotals = [];
			for (let offset = 1; offset <= 6; offset++) {
				const date = new Date(currentDate.getFullYear(), currentDate.getMonth() - offset, 15);
				sixMonthTotals.push(calculateExpenses(expensesForPeriod(ownerExpenses, date)));
			}
			const nonEmptyMonths = sixMonthTotals.filter(total => total > 0);
			const average = nonEmptyMonths.length ? nonEmptyMonths.reduce((sum, total) => sum + total, 0) / nonEmptyMonths.length : 0;
			const cards = [];
			if (previousSpend > 0) {
				const delta = Math.round(((currentSpend - previousSpend) / previousSpend) * 100);
				cards.push({ icon: delta <= 0 ? 'fa-arrow-trend-down' : 'fa-arrow-trend-up', label: 'Month over month', text: `Spending is ${Math.abs(delta)}% ${delta <= 0 ? 'lower' : 'higher'} than last month.` });
			}
			if (largest) {
				cards.push({ icon: 'fa-layer-group', label: 'Largest category', text: `${largest[0]} leads this month at ${formatCurrency(largest[1])}.` });
			}
			if (average > 0) {
				const difference = currentSpend - average;
				cards.push({ icon: 'fa-scale-balanced', label: 'Six-month pace', text: `${formatCurrency(Math.abs(difference))} ${difference <= 0 ? 'below' : 'above'} your recent monthly average.` });
			}
			const targetEntries = Object.entries(categoryTargets).filter(([, target]) => target > 0);
			if (targetEntries.length) {
				const onTrack = targetEntries.filter(([category, target]) => (categoryTotals[category] || 0) <= target).length;
				cards.push({ icon: 'fa-bullseye', label: 'Targets', text: `${onTrack} of ${targetEntries.length} categories are within target.` });
			}
			if (!cards.length) {
				cards.push({ icon: 'fa-feather', label: 'Getting started', text: 'Add a few months of transactions to reveal spending comparisons.' });
			}
			grid.innerHTML = cards.slice(0, 4).map(card => `
				<article class="insight-card">
					<i class="fa-solid ${card.icon}" aria-hidden="true"></i>
					<div><span>${escapeHTML(card.label)}</span><p>${escapeHTML(card.text)}</p></div>
				</article>`).join('');
		}

		function updateTrend(ownerExpenses) {
			const periods = [];
			for (let offset = 11; offset >= 0; offset--) {
				const date = new Date(currentDate.getFullYear(), currentDate.getMonth() - offset, 15);
				const expenses = expensesForPeriod(ownerExpenses, date);
				periods.push({
					label: date.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }),
					income: calculateIncome(expenses),
					spending: calculateExpenses(expenses)
				});
			}
			if (trendChart) trendChart.destroy();
			trendChart = new Chart('monthlyTrendChart', {
				type: 'line',
				data: {
					labels: periods.map(period => period.label),
					datasets: [
						{ label: 'Income', data: periods.map(period => period.income), borderColor: '#4ECDC4', backgroundColor: 'rgba(78, 205, 196, .12)', fill: true, tension: .35 },
						{ label: 'Spending', data: periods.map(period => period.spending), borderColor: '#FF6B6B', backgroundColor: 'rgba(255, 107, 107, .08)', fill: true, tension: .35 }
					]
				},
				options: {
					responsive: true,
					maintainAspectRatio: false,
					interaction: { intersect: false, mode: 'index' },
					plugins: { tooltip: { callbacks: { label: context => `${context.dataset.label}: ${formatCurrency(context.raw)}` } } },
					scales: { y: { beginAtZero: true, ticks: { callback: value => formatCurrency(value) } } }
				}
			});
		}

        function updateCashflow(expenses) {
            const income = calculateIncome(expenses);
            const expenseTotal = calculateExpenses(expenses);
            const balance = income - expenseTotal;
            
            document.getElementById('cashflow-income').textContent = formatCurrency(income);
            document.getElementById('cashflow-expenses').textContent = formatCurrency(expenseTotal);
            document.getElementById('cashflow-balance').textContent = formatCurrency(balance);
            
            const balanceElement = document.getElementById('cashflow-balance');
            if (balance >= 0) {
                balanceElement.classList.add('positive');
                balanceElement.classList.remove('negative');
            } else {
                balanceElement.classList.add('negative');
                balanceElement.classList.remove('positive');
            }
        }

        function createPieChart(categoryData) {
            if (pieChart) pieChart.destroy();
            pieChart = new Chart('categoryPieChart', {
                type: 'doughnut',
                data: {
                    labels: categoryData.map(c => c.category),
                    datasets: [{
                        data: categoryData.map(c => c.total),
                        backgroundColor: categoryData.map(c => categoryColors[c.category]),
                        borderColor: '#1a1a1a',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: (context) => {
                                    const value = context.raw;
                                    const total = context.dataset.data.reduce((sum, val) => sum + val, 0);
                                    const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                                    return `${context.label}: ${formatCurrency(value)} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateLegend(categoryData) {
            const legendContainer = document.getElementById('customLegend');
            legendContainer.innerHTML = '';
            const ownerExpenses = filterByOwner(allExpenses);
            const monthExpenses = getMonthExpenses(ownerExpenses);
            const currentMonthCategories = [...new Set(monthExpenses
                .filter(exp => exp.amount < 0)
                .map(exp => exp.category))];
            const categoryMap = new Map(categoryData.map(cat => [cat.category, cat]));
            
            currentMonthCategories.sort((a, b) => {
                const dataA = categoryMap.get(a);
                const dataB = categoryMap.get(b);
                if (dataA && dataB) return dataB.total - dataA.total;
                if (dataA) return -1;
                if (dataB) return 1;
                return a.localeCompare(b);
            }).forEach(category => {
                const item = document.createElement('div');
                item.className = `legend-item${disabledCategories.has(category) ? ' disabled' : ''}`;
                const color = categoryColors[category];
                const categoryDataItem = categoryMap.get(category);
                const percentage = categoryDataItem ? ` (${categoryDataItem.percentage.toFixed(1)}%)` : '';
                const amount = categoryDataItem ? formatCurrency(categoryDataItem.total) : '';
                item.innerHTML = `
                    <div class="color-box" style="background-color: ${color}"></div>
                    <div class="legend-text">
                        <span>${category}${percentage}</span>
                        <span class="amount">${amount}</span>
                    </div>
                `;
                item.addEventListener('click', () => toggleCategory(category));
                legendContainer.appendChild(item);
            });

            const activeTotalExpenses = monthExpenses
                .filter(exp => exp.amount < 0 && !disabledCategories.has(exp.category))
                .reduce((sum, exp) => sum + Math.abs(exp.amount), 0);

            const totalsHtml = `
                <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span>Total:</span>
                        <span class="amount">
                            ${formatCurrency(activeTotalExpenses)}
                        </span>
                    </div>
                </div>
            `;
            legendContainer.insertAdjacentHTML('beforeend', totalsHtml);
        }

        function toggleCategory(category) {
            if (disabledCategories.has(category)) {
                disabledCategories.delete(category);
            } else {
                disabledCategories.add(category);
            }
            updateChartAndLegend();
        }

        async function initialize() {
            try {
                const configResponse = await fetch('/config');
                if (!configResponse.ok) throw new Error('Failed to fetch configuration');
                const config = await configResponse.json();
                const categorySelect = document.getElementById('category');
                categorySelect.innerHTML = config.categories.map(cat => 
                    `<option value="${cat}">${cat}</option>`
                ).join('');
                currentCurrency = config.currency;
                startDate = config.startDate;
				categoryTargets = config.categoryTargets || {};
                
                // Load saved owner preference
                const savedOwner = localStorage.getItem('expenseowl_owner');
                if (savedOwner) {
                    currentOwner = savedOwner;
                }
                updateOwnerToggleUI();

                const response = await fetch('/expenses');
                if (!response.ok) throw new Error('Failed to fetch data');
                const data = await response.json();
                allExpenses = Array.isArray(data) ? data : (data && Array.isArray(data.expenses) ? data.expenses : []);

                allTags.clear();
                allExpenses.forEach(exp => {
                    if (exp.tags) {
                        exp.tags.forEach(tag => allTags.add(tag));
                    }
                });
                
				const uniqueCategories = [...new Set([...config.categories, ...allExpenses.map(exp => exp.category)])];
                assignCategoryColors(uniqueCategories);
                updateMonthDisplay();
                updateChartAndLegend();
                setupTagInput();
                setupOwnerToggle();
            } catch (error) {
                console.error('Failed to initialize dashboard:', error);
            }
        }

        Chart.defaults.color = '#b3b3b3';
        Chart.defaults.borderColor = '#606060';
        Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

        function setupTagInput() {
            const container = document.getElementById('tags-input-container');
            const input = document.getElementById('tags-input');
            const dropdown = document.getElementById('tags-dropdown');
            const selectedContainer = document.getElementById('selected-tags');
            const formGroup = container.parentElement;

            const addTag = (tag) => {
                tag = tag.trim();
                if (tag && !selectedTags.has(tag)) {
                    selectedTags.add(tag);
                    const pill = document.createElement('div');
                    pill.className = 'tag-pill';
                    pill.textContent = tag;
                    const removeBtn = document.createElement('span');
                    removeBtn.className = 'remove-tag';
                    removeBtn.textContent = '×';
                    removeBtn.onclick = () => {
                        selectedTags.delete(tag);
                        pill.remove();
                    };
                    pill.appendChild(removeBtn);
                    selectedContainer.appendChild(pill);
                }
                input.value = '';
                dropdown.style.display = 'none';
            };

            input.addEventListener('focus', () => {
                dropdown.innerHTML = '';
                const availableTags = [...allTags].filter(tag => !selectedTags.has(tag));
                if (availableTags.length > 0) {
                    availableTags.forEach(tag => {
                        const item = document.createElement('div');
                        item.textContent = tag;
                        item.onclick = () => addTag(tag);
                        dropdown.appendChild(item);
                    });
                    dropdown.style.display = 'block';
                }
            });

            input.addEventListener('input', () => {
                const value = input.value.trim().toLowerCase();
                dropdown.innerHTML = '';
                const filteredTags = [...allTags].filter(tag => tag.toLowerCase().includes(value) && !selectedTags.has(tag));
                
                if (value && ![...allTags].map(t => t.toLowerCase()).includes(value)) {
                    const newItem = document.createElement('div');
                    newItem.textContent = `+ Create "${input.value.trim()}"`;
                    newItem.className = 'new-tag';
                    newItem.onclick = () => addTag(input.value.trim());
                    dropdown.appendChild(newItem);
                }

                filteredTags.forEach(tag => {
                    const item = document.createElement('div');
                    item.textContent = tag;
                    item.onclick = () => addTag(tag);
                    dropdown.appendChild(item);
                });
                
                dropdown.style.display = dropdown.children.length > 0 ? 'block' : 'none';
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (input.value.trim()) {
                        addTag(input.value.trim());
                    }
                }
            });

container.addEventListener('click', () => input.focus());
            document.addEventListener('click', (e) => {
                if (!formGroup.contains(e.target)) {
                    dropdown.style.display = 'none';
                }
            });
        }

    function updateOwnerToggleUI() {
        document.querySelectorAll('.owner-button').forEach(btn => {
            if (btn.dataset.owner === currentOwner) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    function setupOwnerToggle() {
        document.querySelectorAll('.owner-button').forEach(btn => {
            btn.addEventListener('click', () => {
                currentOwner = btn.dataset.owner;
                localStorage.setItem('expenseowl_owner', currentOwner);
                updateOwnerToggleUI();
                updateChartAndLegend();
            });
        });
    }

    document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            updateMonthDisplay();
            updateChartAndLegend();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            updateMonthDisplay();
            updateChartAndLegend();
        });

        document.getElementById('toggleExpenseFormBtn').addEventListener('click', function() {
            const formContainer = document.getElementById('addExpenseContainer');
            const isHidden = formContainer.style.display === 'none' || formContainer.style.display === '';

            if (isHidden) {
                formContainer.style.display = 'block';
                this.innerHTML = '<i class="fa-solid fa-times"></i> Close';
            } else {
                formContainer.style.display = 'none';
                this.innerHTML = '<i class="fa-solid fa-plus"></i> Add Expense';
            }
        });

        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
			const submitButton = e.currentTarget.querySelector('button[type="submit"]');
			submitButton.disabled = true;
            const isGain = document.getElementById('reportGain').checked;
            let amount = parseFloat(document.getElementById('amount').value);
            if (!isGain) {
                amount *= -1;
            }
			const receiptFile = document.getElementById('receipt').files[0];
			let receipt = '';
			const messageDiv = document.getElementById('formMessage');
			try {
				if (receiptFile) {
					messageDiv.textContent = 'Uploading receipt…';
					messageDiv.className = 'form-message';
					const uploadData = new FormData();
					uploadData.append('receipt', receiptFile);
					const uploadResponse = await fetch('/receipt/upload', { method: 'POST', body: uploadData });
					const uploadResult = await uploadResponse.json();
					if (!uploadResponse.ok) throw new Error(uploadResult.error || 'Failed to upload receipt');
					receipt = uploadResult.receipt;
				}
            const formData = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                amount: amount,
                date: getISODateWithLocalTime(document.getElementById('date').value),
                tags: Array.from(selectedTags),
				owner: currentOwner,
				notes: document.getElementById('notes').value,
				receipt: receipt
            };
                const response = await fetch('/expense', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                if (response.ok) {
                    messageDiv.textContent = 'Expense added successfully!';
                    messageDiv.className = 'form-message success';
                    document.getElementById('expenseForm').reset();
                    document.getElementById('selected-tags').innerHTML = '';
                    selectedTags.clear();
                    await initialize();
                    const today = new Date();
                    const year = today.getFullYear();
                    const month = String(today.getMonth() + 1).padStart(2, '0');
                    const day = String(today.getDate()).padStart(2, '0');
                    document.getElementById('date').value = `${year}-${month}-${day}`;
                } else {
                    const error = await response.json();
                    messageDiv.textContent = `Error: ${error.error || 'Failed to add expense'}`;
                    messageDiv.className = 'form-message error';
                }
                setTimeout(() => {
                    messageDiv.textContent = '';
                    messageDiv.className = 'form-message';
                }, 3000);
            } catch (error) {
                console.error('Error adding expense:', error);
				messageDiv.textContent = `Error: ${error.message || 'Failed to add expense'}`;
                messageDiv.className = 'form-message error';
			} finally {
				submitButton.disabled = false;
            }
        });
        document.addEventListener('DOMContentLoaded', initialize);

        document.getElementById('name').addEventListener('click', (e) => {
            if (e.target.value === '-') {
                e.target.value = '';
            }
        });
    </script>
</body>
</html>
