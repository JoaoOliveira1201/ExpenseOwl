<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d12"><link rel="manifest" href="/manifest.webmanifest?v=20260812b"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/style.css?v=20260812b"><script defer src="/functions.js?v=20260812b"></script><script defer src="/settings.js?v=20260812b"></script><script defer src="/pwa.js?v=20260812b"></script><title>Manage · ExpenseOwl</title></head><body>
<header class="site-header"><div class="header-inner"><a class="brand" href="/"><img src="/pwa/icon-192.png" alt=""><span>ExpenseOwl</span><small>Ledger</small></a><nav class="nav"><a href="/">Overview</a><a href="/table">Transactions</a><a href="/signals">Signals</a><a class="active" href="/settings">Manage</a></nav></div></header>
<main class="shell"><div class="page-heading"><div><span class="eyebrow">Ledger controls</span><h1>Manage</h1><p class="lede">Categories, soft targets, and recurring entries.</p></div></div>
<div class="settings-grid section">
<section class="panel"><div class="panel-header"><div><span class="eyebrow">Classification</span><h2>Categories</h2></div></div><div class="panel-body"><div id="categoryList" class="stack"></div><div class="form-actions"><input id="newCategory" placeholder="New category"><button class="button" id="addCategory">Add</button></div><div class="form-actions"><button class="button primary" id="saveCategories">Save categories</button><span id="categoryMessage" class="form-message"></span></div></div></section>
<section class="panel" id="targets"><div class="panel-header"><div><span class="eyebrow">Soft limits</span><h2>Monthly targets</h2></div></div><div class="panel-body"><div id="targetList" class="stack"></div><div class="form-actions"><button class="button primary" id="saveTargets">Save targets</button><span id="targetMessage" class="form-message"></span></div></div></section>
</div>
<section class="section panel"><div class="panel-header"><div><span class="eyebrow">Planned entries</span><h2>Recurring transactions</h2></div></div><div class="panel-body"><form id="recurringForm"><input type="hidden" id="recurringID"><div class="form-grid"><div class="field wide"><label for="recurringName">Name</label><input id="recurringName" required></div><div class="field"><label for="recurringCategory">Category</label><select id="recurringCategory"></select></div><div class="field"><label for="recurringAmount">Amount (€)</label><input id="recurringAmount" type="number" min=".01" step=".01" required></div><div class="field"><label for="recurringStart">Starts</label><input id="recurringStart" type="date" required></div><div class="field"><label for="recurringInterval">Repeats</label><select id="recurringInterval"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="yearly">Yearly</option><option value="daily">Daily</option></select></div><div class="field"><label for="recurringOccurrences">Occurrences</label><input id="recurringOccurrences" type="number" min="2" value="12" required></div><div class="field"><label for="recurringOwner">Owner</label><select id="recurringOwner"><option value="joao">João</option><option value="maria">Maria</option><option value="common">Common</option></select></div><div class="field"><label>Direction</label><label class="check"><input id="recurringGain" type="checkbox"> Report as income</label></div><div class="field wide"><label for="recurringNotes">Notes</label><textarea id="recurringNotes" rows="2" maxlength="2000"></textarea></div></div><div class="form-actions"><button class="button primary" type="submit" id="recurringSubmit">Add recurring transaction</button><button class="button ghost" type="button" id="cancelRecurring" hidden>Cancel edit</button><span class="form-message" id="recurringMessage"></span></div></form><div class="stack section" id="recurringList"></div></div></section>
</main><nav class="mobile-nav"><a href="/">Overview</a><a href="/table">Transactions</a><a href="/signals">Signals</a><a class="active" href="/settings">Manage</a></nav></body></html>
