<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d12">
<link rel="manifest" href="/manifest.webmanifest?v=20260812"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/style.css?v=20260812">
<script defer src="/functions.js?v=20260812"></script><script defer src="/table.js?v=20260812"></script><script defer src="/pwa.js?v=20260812"></script><title>Transactions · ExpenseOwl</title></head><body>
<header class="site-header"><div class="header-inner"><a class="brand" href="/"><img src="/pwa/icon-192.png" alt=""><span>ExpenseOwl</span><small>Ledger</small></a><nav class="nav" aria-label="Primary"><a href="/">Overview</a><a class="active" href="/table">Transactions</a><a href="/signals">Signals</a><a href="/settings">Manage</a></nav></div></header>
<main class="shell">
<div class="page-heading"><div><span class="eyebrow">Complete record</span><h1>Transactions</h1><p class="lede" id="resultCount">Loading the ledger…</p></div><div class="month-rail"><button id="prevMonth" aria-label="Previous month">‹</button><div class="month-label"><span>Statement period</span><strong id="currentMonth"></strong></div><button id="nextMonth" aria-label="Next month">›</button></div></div>
<div class="toolbar"><div class="owner-rail" id="ownerRail"><button data-owner="joao">João</button><button data-owner="maria">Maria</button><button data-owner="common">Household</button></div><div><label class="check" style="display:inline-flex;margin-right:14px"><input id="showAll" type="checkbox"> All dates</label><button class="button primary" id="addButton">＋ Add transaction</button></div></div>
<section class="drawer panel" id="editor"><div class="panel-header"><div><span class="eyebrow" id="editorKicker">New entry</span><h2 id="editorTitle">Add transaction</h2></div><button class="icon-button" id="closeEditor" aria-label="Close">×</button></div><form class="panel-body" id="expenseForm"><div class="form-grid">
<div class="field wide"><label for="name">Name</label><input id="name" maxlength="255" required></div><div class="field"><label for="category">Category</label><select id="category" required></select></div>
<div class="field"><label for="amount">Amount (€)</label><input id="amount" type="number" min=".01" step=".01" required></div><div class="field"><label for="date">Date</label><input id="date" type="date" required></div><div class="field"><label>Direction</label><label class="check"><input id="gain" type="checkbox"> Report as income</label></div>
<div class="field wide"><label for="notes">Notes</label><textarea id="notes" rows="2" maxlength="2000"></textarea></div><div class="field"><label for="receipt">Replace receipt</label><input id="receipt" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><label class="check" id="removeReceiptLabel" hidden><input id="removeReceipt" type="checkbox"> Remove current receipt</label></div>
</div><div class="form-actions"><button class="button primary" type="submit">Save transaction</button><button class="button ghost" id="cancelEdit" type="button">Cancel</button><span class="form-message" id="formMessage"></span></div></form></section>
<section class="filter-panel" aria-label="Filters"><div><label for="search">Search</label><input id="search" type="search" placeholder="Name, note, or category"></div><div><label for="filterCategory">Category</label><select id="filterCategory"><option value="">All categories</option></select></div><div><label for="filterType">Direction</label><select id="filterType"><option value="">Income and spending</option><option value="expense">Spending</option><option value="income">Income</option></select></div><div><label for="filterAmount">Minimum amount</label><input id="filterAmount" type="number" min="0" step=".01" placeholder="Any"></div><button class="button ghost" id="clearFilters" type="button">Clear</button></section>
<div class="table-wrap"><table><thead><tr><th>Date</th><th>Name</th><th>Category</th><th>Owner</th><th>Notes</th><th>Amount</th><th></th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>No transactions match this view.</div></div>
</main><nav class="mobile-nav"><a href="/">Overview</a><a class="active" href="/table">Transactions</a><a href="/signals">Signals</a><a href="/settings">Manage</a></nav></body></html>
