<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/fa.min.css">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="application-name" content="ExpenseOwl">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ExpenseOwl">
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
    <link rel="icon" href="/pwa/icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="/pwa/icon-192.png">
    <link rel="stylesheet" href="/style.css">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'system';
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <script src="/pwa.js"></script>
    <title>ExpenseOwl Table</title>
</head>
<body>
    <div class="container">
        <header>
            <div class="nav-bar">
                <a href="/">
                    <img src="/pwa/icon-192.png" alt="ExpenseOwl Logo" height="85" style="vertical-align: middle; margin-right: 20px;">
                </a>
                <a href="/" class="view-button" data-tooltip="Dashboard">
                    <i class="fa-solid fa-chart-pie"></i>
                </a>
                <a href="/table" class="view-button active" data-tooltip="Table View">
                    <i class="fa-solid fa-table"></i>
                </a>
                <a href="/settings" class="view-button" data-tooltip="Settings">
                    <i class="fa-solid fa-gear"></i>
                </a>
            </div>
        </header>

        <div class="month-navigation">
            <button id="prevMonth" class="nav-button"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="current-month" id="currentMonth"></div>
            <button id="nextMonth" class="nav-button"><i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <div class="owner-toggle" id="ownerToggle">
            <button class="owner-button" data-owner="joao">João</button>
            <button class="owner-button" data-owner="maria">Maria</button>
            <button class="owner-button" data-owner="common">Common</button>
        </div>
        
        <div class="table-controls">
            <label for="showAllToggle">
                <input type="checkbox" id="showAllToggle" class="styled-checkbox"> Show All Transactions
            </label>
        </div>

		<div class="filter-panel" aria-label="Transaction filters">
			<div class="form-group">
				<label for="filterSearch">Search</label>
				<input type="search" id="filterSearch" placeholder="Name, note, or tag">
			</div>
			<div class="form-group">
				<label for="filterCategory">Category</label>
				<select id="filterCategory"><option value="">All categories</option></select>
			</div>
			<div class="form-group">
				<label for="filterTag">Tag</label>
				<select id="filterTag"><option value="">All tags</option></select>
			</div>
			<div class="form-group">
				<label for="filterType">Type</label>
				<select id="filterType">
					<option value="">Income & expenses</option>
					<option value="expense">Expenses</option>
					<option value="income">Income</option>
				</select>
			</div>
			<div class="form-group">
				<label for="filterFrom">From</label>
				<input type="date" id="filterFrom">
			</div>
			<div class="form-group">
				<label for="filterTo">To</label>
				<input type="date" id="filterTo">
			</div>
			<div class="form-group">
				<label for="filterMin">Minimum amount</label>
				<input type="number" id="filterMin" min="0" step="0.01" placeholder="0">
			</div>
			<div class="form-group">
				<label for="filterMax">Maximum amount</label>
				<input type="number" id="filterMax" min="0" step="0.01" placeholder="Any">
			</div>
			<div class="filter-actions">
				<button type="button" id="clearFilters" class="nav-button">Clear filters</button>
			</div>
			<div id="filterSummary" class="filter-summary" aria-live="polite"></div>
		</div>

        <div class="form-container">
            <form id="expenseForm" class="expense-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" value="-" required>
                </div>
                
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">categories</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tags-input">Tags</label>
                    <div id="tags-input-container" class="tags-input-container">
                        <div id="selected-tags" class="selected-tags"></div>
                        <input type="text" id="tags-input" placeholder="(optional)">
                    </div>
                    <div id="tags-dropdown" class="tags-dropdown"></div>
                </div>
                
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" step="0.01" min="0.01" max="9000000000000000" required>
                </div>
                
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                    <script>
                        const today = new Date();
                        const year = today.getFullYear();
                        const month = String(today.getMonth() + 1).padStart(2, '0');
                        const day = String(today.getDate()).padStart(2, '0');
                        const formattedDate = `${year}-${month}-${day}`;
                        document.getElementById('date').value = formattedDate;
                    </script>
                </div>
                
                <div class="form-group form-group-checkbox">
                    <label for="reportGain">Report Gain</label>
                    <input type="checkbox" id="reportGain" class="styled-checkbox">
                </div>

				<div class="form-group form-group-wide">
					<label for="notes">Notes</label>
					<textarea id="notes" maxlength="2000" rows="2" placeholder="Optional context"></textarea>
				</div>

				<div class="form-group">
					<label for="receipt">Receipt</label>
					<input type="file" id="receipt" accept="image/jpeg,image/png,image/webp,application/pdf">
					<small>JPG, PNG, WebP, or PDF · 5 MB max</small>
					<div id="existingReceipt"></div>
				</div>

                <button type="submit" class="nav-button">Add Expense</button>
            </form>
            <div id="formMessage" class="form-message"></div>
        </div>

        <div id="tableContainer">
        </div>
    </div>

    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <h3>Delete Expense</h3>
            <p>Are you sure you want to delete this expense? (cannot be undone)</p>
            <div class="modal-buttons">
                <button class="modal-button" onclick="closeDeleteModal()">Cancel</button>
                <button class="modal-button confirm" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script src="/functions.js"></script>
    <script>
        let currentCurrency = 'usd';
        let currentDate = new Date();
        let allExpenses = [];
        let expensesForTable = [];
        let startDate = 1;
        let allTags = new Set();
        let selectedTags = new Set();
        let currentOwner = 'joao';
		let controlsReady = false;

        function createTable(expenses) {
            if (!expenses || expenses.length === 0) {
                const message = document.getElementById('showAllToggle').checked ? 
                                'No transactions found' : 
                                'No expenses recorded for this month';
                return `<div class="no-data">${message}</div>`;
            }
            const hasTags = expenses.some(exp => exp.tags && exp.tags.length > 0);
            return `
                <table class="expense-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Category</th>
                            ${hasTags ? '<th class="tags-column">Tags</th>' : ''}
                            <th>Amount</th>
                            <th class="date-header">Date</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        ${expenses.map((expense, index) => `
                            <tr>
								<td>
									${escapeHTML(expense.name)}
									${expense.notes ? `<span class="transaction-note">${escapeHTML(expense.notes)}</span>` : ''}
									${expense.receipt ? `<a class="receipt-link" href="${escapeHTML(expense.receipt)}" target="_blank" rel="noopener"><i class="fa-solid fa-paperclip"></i> Receipt</a>` : ''}
								</td>
                                <td>${escapeHTML(expense.category)}</td>
                                ${hasTags ? `<td class="tags-column">${(expense.tags || []).map(escapeHTML).join(', ')}</td>` : ''}
                                <td class="amount">${formatCurrency(expense.amount)}</td>
                                <td class="date-column">${formatDateFromUTC(expense.date)}</td>
                                <td>
                                    <button class="edit-button" onclick="editExpenseByIndex(${index})">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </button>
                                    <button class="delete-button" onclick="handleDeleteClick(event, '${expense.id}')">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function filterByOwner(expenses) {
            if (currentOwner === 'common') return expenses;
            return expenses.filter(exp => {
                const owner = exp.owner || 'common';
                return owner === currentOwner;
            });
        }

        function updateTable() {
            const showAll = document.getElementById('showAllToggle').checked;
            document.querySelector('.month-navigation').style.display = showAll ? 'none' : 'flex';

            const ownerExpenses = filterByOwner(allExpenses);
			let baseExpenses = showAll
                ? ownerExpenses.slice().sort((a, b) => new Date(b.date) - new Date(a.date))
                : getMonthExpenses(ownerExpenses);
			expensesForTable = applyFilters(baseExpenses);
            
            const tableContainer = document.getElementById('tableContainer');
            tableContainer.innerHTML = createTable(expensesForTable);
			const net = expensesForTable.reduce((sum, expense) => sum + expense.amount, 0);
			document.getElementById('filterSummary').textContent = `${expensesForTable.length} transaction${expensesForTable.length === 1 ? '' : 's'} · Net ${formatCurrency(net)}`;
        }

		function applyFilters(expenses) {
			const query = document.getElementById('filterSearch').value.trim().toLowerCase();
			const category = document.getElementById('filterCategory').value;
			const tag = document.getElementById('filterTag').value;
			const type = document.getElementById('filterType').value;
			const from = document.getElementById('filterFrom').value;
			const to = document.getElementById('filterTo').value;
			const minimum = parseFloat(document.getElementById('filterMin').value);
			const maximum = parseFloat(document.getElementById('filterMax').value);
			return expenses.filter(expense => {
				const haystack = [expense.name, expense.category, expense.notes, ...(expense.tags || [])].join(' ').toLowerCase();
				const localDate = new Date(expense.date);
				const dateKey = `${localDate.getFullYear()}-${String(localDate.getMonth() + 1).padStart(2, '0')}-${String(localDate.getDate()).padStart(2, '0')}`;
				const absoluteAmount = Math.abs(expense.amount);
				return (!query || haystack.includes(query)) &&
					(!category || expense.category === category) &&
					(!tag || (expense.tags || []).includes(tag)) &&
					(!type || (type === 'expense' ? expense.amount < 0 : expense.amount > 0)) &&
					(!from || dateKey >= from) && (!to || dateKey <= to) &&
					(Number.isNaN(minimum) || absoluteAmount >= minimum) &&
					(Number.isNaN(maximum) || absoluteAmount <= maximum);
			});
		}

        function updateOwnerToggleUI() {
            document.querySelectorAll('.owner-button').forEach(btn => {
                if (btn.dataset.owner === currentOwner) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function setupOwnerToggle() {
            document.querySelectorAll('.owner-button').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentOwner = btn.dataset.owner;
                    localStorage.setItem('expenseowl_owner', currentOwner);
                    updateOwnerToggleUI();
                    updateTable();
                });
            });
        }

        function editExpenseByIndex(index) {
            const expense = expensesForTable[index];
            if (expense) {
				editExpense(expense);
            }
        }

        function renderSelectedTags(tags) {
            const selectedContainer = document.getElementById('selected-tags');
            selectedContainer.innerHTML = '';
            selectedTags.clear();
            (tags || []).forEach(tag => {
                selectedTags.add(tag);
                const pill = document.createElement('div');
                pill.className = 'tag-pill';
                pill.textContent = tag;
                const removeBtn = document.createElement('span');
                removeBtn.className = 'remove-tag';
                removeBtn.textContent = '×';
                removeBtn.onclick = () => {
                    selectedTags.delete(tag);
                    pill.remove();
                };
                pill.appendChild(removeBtn);
                selectedContainer.appendChild(pill);
            });
        }

		function editExpense(expense) {
			const isGain = expense.amount > 0;
			document.getElementById('name').value = expense.name;
			document.getElementById('category').value = expense.category;
			document.getElementById('amount').value = Math.abs(expense.amount);
            document.getElementById('reportGain').checked = isGain;
			document.getElementById('notes').value = expense.notes || '';
			renderSelectedTags(expense.tags || []);
			const existingReceipt = document.getElementById('existingReceipt');
			if (expense.receipt) {
				existingReceipt.innerHTML = `<a class="receipt-link" href="${escapeHTML(expense.receipt)}" target="_blank" rel="noopener">View current receipt</a> <label><input type="checkbox" id="removeReceipt"> Remove</label>`;
			} else {
				existingReceipt.innerHTML = '';
			}
            
			const localDate = new Date(expense.date);
            const year = localDate.getFullYear();
            const month = String(localDate.getMonth() + 1).padStart(2, '0');
            const day = String(localDate.getDate()).padStart(2, '0');
            document.getElementById('date').value = `${year}-${month}-${day}`;
            
            const form = document.getElementById('expenseForm');
			form.dataset.editId = expense.id;
			form.dataset.receipt = expense.receipt || '';
			form.dataset.owner = expense.owner || 'common';
            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.textContent = 'Update Expense';
            
            form.scrollIntoView({ behavior: 'smooth' });
        }

        function setupTagInput() {
            const container = document.getElementById('tags-input-container');
            const input = document.getElementById('tags-input');
            const dropdown = document.getElementById('tags-dropdown');
            const formGroup = container.parentElement;

            const addTag = (tag) => {
                tag = tag.trim();
                if (tag && !selectedTags.has(tag)) {
                    selectedTags.add(tag);
                    renderSelectedTags(Array.from(selectedTags));
                }
                input.value = '';
                dropdown.style.display = 'none';
            };

            input.addEventListener('focus', () => {
                dropdown.innerHTML = '';
                const availableTags = [...allTags].filter(tag => !selectedTags.has(tag));
                if (availableTags.length > 0) {
                    availableTags.forEach(tag => {
                        const item = document.createElement('div');
                        item.textContent = tag;
                        item.onclick = () => addTag(tag);
                        dropdown.appendChild(item);
                    });
                    dropdown.style.display = 'block';
                }
            });

            input.addEventListener('input', () => {
                const value = input.value.trim().toLowerCase();
                dropdown.innerHTML = '';
                const filteredTags = [...allTags].filter(tag => tag.toLowerCase().includes(value) && !selectedTags.has(tag));
                
                if(value && ![...allTags].map(t => t.toLowerCase()).includes(value)) {
                    const newItem = document.createElement('div');
                    newItem.textContent = `+ Create "${input.value.trim()}"`;
                    newItem.className = 'new-tag';
                    newItem.onclick = () => addTag(input.value.trim());
                    dropdown.appendChild(newItem);
                }

                if (filteredTags.length > 0) {
                    filteredTags.forEach(tag => {
                        const item = document.createElement('div');
                        item.textContent = tag;
                        item.onclick = () => addTag(tag);
                        dropdown.appendChild(item);
                    });
                }
                
                dropdown.style.display = 'block';
                if (dropdown.children.length === 0) dropdown.style.display = 'none';
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (input.value.trim()) {
                        addTag(input.value.trim());
                    }
                }
            });

            container.addEventListener('click', () => input.focus());
            document.addEventListener('click', (e) => {
                if (!formGroup.contains(e.target)) {
                    dropdown.style.display = 'none';
                }
            });
        }

        async function initialize() {
            try {
                const configResponse = await fetch('/config');
                if (!configResponse.ok) throw new Error('Failed to fetch configuration');
                const config = await configResponse.json();
                const categorySelect = document.getElementById('category');
                categorySelect.innerHTML = config.categories.map(cat => 
                    `<option value="${cat}">${cat}</option>`
                ).join('');
				const selectedCategoryFilter = document.getElementById('filterCategory').value;
				document.getElementById('filterCategory').innerHTML = '<option value="">All categories</option>' + config.categories.map(cat =>
					`<option value="${escapeHTML(cat)}">${escapeHTML(cat)}</option>`
				).join('');
				document.getElementById('filterCategory').value = selectedCategoryFilter;
                currentCurrency = config.currency;
                startDate = config.startDate;
                
                // Load saved owner preference
                const savedOwner = localStorage.getItem('expenseowl_owner');
                if (savedOwner) {
                    currentOwner = savedOwner;
                }
                updateOwnerToggleUI();

                const response = await fetch('/expenses');
                if (!response.ok) throw new Error('Failed to fetch data');
                const data = await response.json();
                allExpenses = Array.isArray(data) ? data : (data && Array.isArray(data.expenses) ? data.expenses : []);
                
                allTags.clear();
                allExpenses.forEach(exp => {
                    if (exp.tags) {
                        exp.tags.forEach(tag => allTags.add(tag));
                    }
                });
				const selectedTagFilter = document.getElementById('filterTag').value;
				document.getElementById('filterTag').innerHTML = '<option value="">All tags</option>' + [...allTags].sort().map(tag =>
					`<option value="${escapeHTML(tag)}">${escapeHTML(tag)}</option>`
				).join('');
				document.getElementById('filterTag').value = selectedTagFilter;

                updateMonthDisplay();
                updateTable();
				if (!controlsReady) {
					setupOwnerToggle();
					setupTagInput();
					controlsReady = true;
				}
            } catch (error) {
                console.error('Failed to initialize table:', error);
                document.getElementById('tableContainer').innerHTML = 
                    '<div class="no-data">Failed to load expenses</div>';
            }
        }

        document.getElementById('showAllToggle').addEventListener('change', updateTable);
		['filterSearch', 'filterCategory', 'filterTag', 'filterType', 'filterFrom', 'filterTo', 'filterMin', 'filterMax'].forEach(id => {
			document.getElementById(id).addEventListener('input', updateTable);
		});
		document.getElementById('clearFilters').addEventListener('click', () => {
			['filterSearch', 'filterCategory', 'filterTag', 'filterType', 'filterFrom', 'filterTo', 'filterMin', 'filterMax'].forEach(id => {
				document.getElementById(id).value = '';
			});
			updateTable();
		});

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            updateMonthDisplay();
            updateTable();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            updateMonthDisplay();
            updateTable();
        });

        let expenseToDelete = null;

        function showDeleteModal(id) {
            expenseToDelete = id;
            document.getElementById('deleteModal').classList.add('active');
        }

        function handleDeleteClick(event, id) {
            if (event.shiftKey) {
                expenseToDelete = id;
                confirmDelete();
            } else {
                showDeleteModal(id);
            }
        }

        function closeDeleteModal() {
            expenseToDelete = null;
            document.getElementById('deleteModal').classList.remove('active');
        }

        async function confirmDelete() {
            if (!expenseToDelete) return;
            try {
                const response = await fetch(`/expense/delete?id=${expenseToDelete}`, {
                    method: 'DELETE'
                });
                if (!response.ok) {
                    throw new Error('Failed to delete expense');
                }
                await initialize();
                closeDeleteModal();
            } catch (error) {
                console.error('Error deleting expense:', error);
                alert('Failed to delete expense. Please try again.');
            }
        }

        document.getElementById('deleteModal').addEventListener('click', (e) => {
            if (e.target.className === 'modal active') {
                closeDeleteModal();
            }
        });

        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const editId = form.dataset.editId;
			const submitButton = form.querySelector('button[type="submit"]');
			submitButton.disabled = true;
            const isGain = document.getElementById('reportGain').checked;
            let amount = parseFloat(document.getElementById('amount').value);
            if (!isGain) {
                amount *= -1;
            }

			const receiptFile = document.getElementById('receipt').files[0];
			const removeReceipt = document.getElementById('removeReceipt')?.checked;
			let receipt = removeReceipt ? '' : (form.dataset.receipt || '');
			const messageDiv = document.getElementById('formMessage');
			try {
				if (receiptFile) {
					messageDiv.textContent = 'Uploading receipt…';
					messageDiv.className = 'form-message';
					const uploadData = new FormData();
					uploadData.append('receipt', receiptFile);
					const uploadResponse = await fetch('/receipt/upload', { method: 'POST', body: uploadData });
					const uploadResult = await uploadResponse.json();
					if (!uploadResponse.ok) throw new Error(uploadResult.error || 'Failed to upload receipt');
					receipt = uploadResult.receipt;
				}
            const formData = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                amount: amount,
                date: getISODateWithLocalTime(document.getElementById('date').value),
                tags: Array.from(selectedTags),
				owner: editId ? form.dataset.owner : currentOwner,
				notes: document.getElementById('notes').value,
				receipt: receipt
            };
                const url = editId ? `/expense/edit?id=${editId}` : '/expense';
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                if (response.ok) {
                    messageDiv.textContent = editId ? 'Expense updated successfully!' : 'Expense added successfully!';
                    messageDiv.className = 'form-message success';
                    form.reset();
                    document.getElementById('selected-tags').innerHTML = '';
                    selectedTags.clear();
                    delete form.dataset.editId;
					delete form.dataset.receipt;
					delete form.dataset.owner;
					document.getElementById('existingReceipt').innerHTML = '';
                    form.querySelector('button[type="submit"]').textContent = 'Add Expense';
                    await initialize();
                    const today = new Date();
                    const year = today.getFullYear();
                    const month = String(today.getMonth() + 1).padStart(2, '0');
                    const day = String(today.getDate()).padStart(2, '0');
                    document.getElementById('date').value = `${year}-${month}-${day}`;
                } else {
                    const error = await response.json();
                    messageDiv.textContent = `Error: ${error.error || 'Failed to save expense'}`;
                    messageDiv.className = 'form-message error';
                }
                setTimeout(() => {
                    messageDiv.textContent = '';
                    messageDiv.className = 'form-message';
                }, 3000);
            } catch (error) {
                console.error('Error saving expense:', error);
				messageDiv.textContent = `Error: ${error.message || 'Failed to save expense'}`;
                messageDiv.className = 'form-message error';
			} finally {
				submitButton.disabled = false;
            }
        });
        document.addEventListener('DOMContentLoaded', initialize);

        document.getElementById('name').addEventListener('click', (e) => {
            if (e.target.value === '-') {
                e.target.value = '';
            }
        });
        
        window.editExpenseByIndex = editExpenseByIndex;
    </script>
</body>
</html>
